name: Security Gates

on:
  push:
    branches: [main, master]

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: Scan container image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build image for scanning
        run: docker build --pull --no-cache --tag va-automation:security .

      - name: Install Trivy
        env:
          TRIVY_VERSION: 0.69.3
        run: |
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP" trivy

      - name: Scan image with Trivy
        run: |
          "$RUNNER_TEMP/trivy" image \
            --format table \
            --exit-code 1 \
            --ignore-unfixed \
            --severity CRITICAL,HIGH \
            va-automation:security

  security-gate:
    name: Security gate
    if: ${{ always() }}
    needs: [trivy]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require security scans to pass
        run: |
          if [[ "${{ needs.trivy.result }}" != "success" ]]; then
            echo "Security gate failed."
            echo "trivy=${{ needs.trivy.result }}"
            exit 1
          fi
          echo "Security gate passed."
