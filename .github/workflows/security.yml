name: Security Gates

on:
  push:
    branches: [main, master]

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-gate:
    name: Security gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Security gate passed
        run: echo "Security gate passed."
