name: Semgrep

on:
  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep Security Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        # Upgraded to v3 to support modern engine architecture overrides
        uses: semgrep/semgrep-action@v3
        with:
          # Forces act to pull a multi-platform image that runs natively on your Mac
          image: returntocorp/semgrep:latest
          config: >-
            p/javascript
            p/typescript
            p/security-audit
