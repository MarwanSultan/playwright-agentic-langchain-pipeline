name: Quality Gates

on:
  push:
    branches: [main, master]

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.14.0
  ACT: false

jobs:
  quality:
    name: Static quality and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Audit production dependency tree
        run: npm audit --audit-level=high

      - name: Upload unit results
        if: ${{ !cancelled() && env.ACT != 'true' }}
        uses: actions/upload-artifact@v5
        with:
          name: unit-results
          path: test-results/unit-junit.xml
          if-no-files-found: ignore
          retention-days: 14

  browser:
    name: ${{ matrix.project }} shard ${{ matrix.shard }}/2
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false

      matrix:
        project: [chromium, firefox, webkit]
        shard: [1, 2]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser dependencies
        run: npx playwright install --with-deps ${{ matrix.project }}

      - name: Run Playwright shard
        env:
          CI: true
          HEADLESS: true
        run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2

      - name: Upload browser diagnostics
        if: ${{ !cancelled() && env.ACT != 'true' }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-${{ matrix.project }}-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  container:
    name: Container smoke test
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build test image
        run: docker build --tag va-automation:test .

      - name: Run Chromium smoke suite in container
        run: docker run --rm --env CI=true --env HEADLESS=true va-automation:test npm test -- --project=chromium

  quality-gate:
    name: Quality gate
    if: ${{ always() }}
    needs: [quality, browser, container]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require all quality jobs to pass
        run: |
          if [[ "${{ needs.quality.result }}" != "success" || \
                "${{ needs.browser.result }}" != "success" || \
                "${{ needs.container.result }}" != "success" ]]; then
            echo "Quality gate failed."
            echo "quality=${{ needs.quality.result }}"
            echo "browser=${{ needs.browser.result }}"
            echo "container=${{ needs.container.result }}"
            exit 1
          fi
          echo "Quality gate passed."
