name: Gitleaks Secret Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Fetches full commit history for a thorough deep scan
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP" gitleaks

      - name: Scan repository with Gitleaks
        run: |
          "$RUNNER_TEMP/gitleaks" detect --source=. --verbose --redact
