version: 2

updates:
  # ============================================================
  # NPM / Node.js Dependencies
  # ============================================================
  - package-ecosystem: 'npm'
    directory: '/'

    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:00'
      timezone: 'America/New_York'

    # Group routine dependency updates to reduce PR noise.
    groups:
      npm-dependencies:
        patterns:
          - '*'

    # Allow newly released dependencies time to stabilize.
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7

    open-pull-requests-limit: 10

  # ============================================================
  # GitHub Actions
  # ============================================================
  - package-ecosystem: 'github-actions'
    directory: '/'

    schedule:
      interval: 'weekly'
      day: 'tuesday'
      time: '03:00'
      timezone: 'America/New_York'

    # Group routine GitHub Actions updates to reduce PR noise.
    groups:
      github-actions:
        patterns:
          - '*'

    # Allow newly released Actions time to stabilize.
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7

    open-pull-requests-limit: 10

  # ============================================================
  # Docker
  # ============================================================
  - package-ecosystem: 'docker'
    directory: '/'

    schedule:
      interval: 'weekly'
      day: 'wednesday'
      time: '03:00'
      timezone: 'America/New_York'

    # Group Docker dependency updates to reduce PR noise.
    groups:
      docker-dependencies:
        patterns:
          - '*'

    # Allow newly released images time to stabilize.
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7

    open-pull-requests-limit: 10
